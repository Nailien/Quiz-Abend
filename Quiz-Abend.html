<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quiz-Abend</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Big+Shoulders+Display:wght@800;900&family=Figtree:wght@400;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
/* Layout: Fernsehstudio in Schwarz mit violettem Scheinwerferlicht von oben.
   Brett mit weissen Punktzahlen auf Violett, zwei Teamkarten (Pink gegen Hellviolett) mit allen Spielerpunkten.
   Bewusst nur ein dunkler Look, alle Farben stehen als Tokens hier. */
:root{
  color-scheme:dark;
  --bg:#07050d; --bg-glow:#7a2cff; --ink:#fafaff; --muted:#bba9dc;
  --panel:rgba(22,11,42,.82); --panel-line:rgba(190,150,255,.28);
  --tile-top:#8b4dff; --tile-bot:#4a1bb5; --tile-edge:#230a66; --tile-rim:rgba(230,210,255,.55);
  --head-top:#1f1436; --head-bot:#0d0818;
  --accent:#ff3d9a; --accent-deep:#9c1160; --accent-ink:#14000b;
  --used:#120a26; --good:#38e0a0; --bad:#ff8a8a;
  --t1:#ff3d9a; --t2:#b69cff;
  --display:'Bowlby One','Arial Black',Impact,sans-serif;
  --num:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
html{background:var(--bg)}
body{background-color:var(--bg);background-image:radial-gradient(ellipse 90% 60% at 50% -8%,var(--bg-glow) 0%,rgba(122,44,255,.35) 38%,rgba(7,5,13,0) 75%);background-repeat:no-repeat;background-attachment:fixed;color:var(--ink);font:16px/1.45 var(--body);padding-inline:16px;padding-block:22px 56px;margin:0;min-height:100%}
*{box-sizing:border-box}
.wrap{max-width:1560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{margin:0;font:400 clamp(26px,6.5vw,46px)/1.05 var(--display);letter-spacing:.01em;text-transform:uppercase;color:#fff;text-shadow:0 4px 0 var(--accent),0 8px 22px rgba(0,0,0,.5);overflow-wrap:anywhere;min-width:0}
.chip{font:700 13px var(--body);letter-spacing:.08em;text-transform:uppercase;padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.1);border:2px solid var(--panel-line);color:var(--ink)}
.muted{color:var(--muted)}
.small{font-size:14px}
.panel{background:var(--panel);border:2px solid var(--panel-line);border-radius:16px;padding:18px;min-width:0;backdrop-filter:blur(4px)}
.panel h2{margin:0 0 12px;font:400 22px/1.1 var(--display);letter-spacing:.02em;text-transform:uppercase;color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font:700 12px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
input,textarea{width:100%;font:inherit;padding:11px 13px;border-radius:10px;border:2px solid var(--panel-line);background:rgba(8,4,18,.8);color:var(--ink)}
input::placeholder,textarea::placeholder{color:#8a76b8}
textarea{resize:vertical;min-height:72px}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{font:700 16px var(--body);padding:11px 20px;border-radius:12px;border:0;background:linear-gradient(#ff7cba,var(--accent));color:var(--accent-ink);cursor:pointer;box-shadow:0 4px 0 var(--accent-deep),0 8px 18px rgba(0,0,0,.35);transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-deep)}
.btn.ghost{background:rgba(255,255,255,.08);color:var(--ink);box-shadow:none;border:2px solid var(--panel-line)}
.btn.danger{background:transparent;color:var(--bad);border:2px solid var(--bad);box-shadow:none}
.mini{font:700 13px var(--body);padding:6px 11px;border-radius:8px;border:2px solid var(--panel-line);background:rgba(255,255,255,.07);color:var(--ink);cursor:pointer}
.mini.good{border-color:var(--good);color:var(--good)}
.mini.bad{border-color:var(--bad);color:var(--bad)}
.mini:hover{filter:brightness(1.25)}
.err{margin:0;color:var(--bad);font-weight:700}
.note{margin:0;min-height:1.4em;color:var(--muted);font-size:14px}
.login{max-width:460px;margin-inline:auto;width:100%}
.code{font:700 22px var(--mono);letter-spacing:.1em;background:rgba(8,4,18,.8);border:2px dashed var(--accent);color:var(--accent);padding:6px 14px;border-radius:10px;user-select:all;overflow-wrap:anywhere}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{font:700 15px var(--body);padding:9px 16px;border-radius:10px;border:2px solid var(--panel-line);background:rgba(255,255,255,.06);color:var(--ink);cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.layout{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
@media (min-width:920px){.layout.admin{grid-template-columns:minmax(0,1fr) 320px;align-items:start}}
.banner{padding:11px 15px;border-radius:10px;border:2px solid var(--accent);background:rgba(255,61,154,.12);font-weight:600}

/* Brett */
.board{display:grid;gap:10px;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));padding:10px;border-radius:16px;background:rgba(8,4,18,.6);border:2px solid var(--panel-line)}
.cat{background:linear-gradient(var(--head-top),var(--head-bot));color:#fff;font:400 clamp(11px,2.5vw,20px)/1.15 var(--display);text-transform:uppercase;text-align:center;padding:10px 4px;display:flex;align-items:center;justify-content:center;min-height:3.6em;border-radius:8px;border-bottom:4px solid var(--accent);overflow-wrap:anywhere}
.tile{border:2px solid var(--tile-rim);border-radius:8px;background:linear-gradient(var(--tile-top),var(--tile-bot));color:#fff;font:900 clamp(26px,7vw,58px)/1 var(--num);letter-spacing:.02em;padding-block:clamp(12px,3.6vw,28px);cursor:default;min-width:0;text-shadow:0 3px 0 rgba(25,0,70,.65),0 0 20px rgba(255,61,154,.6);box-shadow:0 5px 0 var(--tile-edge),inset 0 2px 0 rgba(255,255,255,.25)}
.tile.used{background:var(--used);border-color:transparent;color:transparent;text-shadow:none;box-shadow:inset 0 3px 8px rgba(0,0,0,.6)}
.tile.none{background:transparent;border-color:transparent;box-shadow:none;text-shadow:none}
.board.pick .tile.open,.board.admin .tile.open{cursor:pointer}
.board.pick .tile.open:hover,.board.admin .tile.open:hover{filter:brightness(1.22);transform:translateY(-2px)}
.board.pick .tile.open{animation:glow 1.6s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 5px 0 var(--tile-edge),inset 0 2px 0 rgba(255,255,255,.25),0 0 0 0 rgba(255,61,154,0)}50%{box-shadow:0 5px 0 var(--tile-edge),inset 0 2px 0 rgba(255,255,255,.25),0 0 0 4px rgba(255,61,154,.9)}}
@media (prefers-reduced-motion:reduce){.board.pick .tile.open{animation:none;box-shadow:0 5px 0 var(--tile-edge),0 0 0 3px var(--accent)}}
.turnline{margin:0;font:400 clamp(18px,4vw,28px)/1.15 var(--display);letter-spacing:.01em;text-transform:uppercase;text-align:center}
.turnline.me{color:var(--accent)}

/* Frage */
.qcard{background:linear-gradient(var(--tile-top),var(--tile-bot));border:3px solid var(--tile-rim);border-radius:18px;padding:clamp(20px,5vw,44px);text-align:center;display:flex;flex-direction:column;gap:18px;align-items:center;box-shadow:0 8px 0 var(--tile-edge),0 20px 40px rgba(0,0,0,.4)}
.qmeta{font:400 clamp(16px,3.6vw,24px)/1.1 var(--display);letter-spacing:.03em;text-transform:uppercase;color:#fff;text-shadow:0 3px 0 var(--accent)}
.qtext{margin:0;font:700 clamp(22px,5vw,40px)/1.25 var(--body);text-wrap:balance;overflow-wrap:anywhere;text-shadow:0 2px 0 rgba(20,0,60,.5)}
.qans{padding:16px 24px;border-radius:14px;background:#fff;color:#14000b;border:0;box-shadow:0 6px 0 var(--accent);font:800 clamp(26px,6vw,46px)/1.2 var(--body);overflow-wrap:anywhere;max-width:100%;text-wrap:balance}
.qans .qlabel{color:var(--accent-deep)}
.qans.pop{animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.qans.pop{animation:none}}
.qlabel{font:700 12px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:4px}
.solution{border-color:var(--panel-line)}
.solution.shown{border-color:var(--accent)}
.solutiontext{margin:0;font:800 clamp(24px,5vw,38px)/1.2 var(--body);overflow-wrap:anywhere}
.bigbtn{font-size:18px;padding:14px 24px;width:100%}
.qitem.on{border-color:var(--accent)}
.qtitle{font:400 20px/1.2 var(--display);text-transform:uppercase;overflow-wrap:anywhere;min-width:0}

/* Teams */
.teams{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.teams.side{grid-template-columns:minmax(0,1fr)}
@media (max-width:560px){.teams.side{grid-template-columns:minmax(0,1fr)}}
.team{--tc:var(--t1);background:var(--panel);border:2px solid var(--tc);border-radius:16px;padding:14px;min-width:0;display:flex;flex-direction:column;gap:10px;box-shadow:0 0 0 3px rgba(0,0,0,.2),0 0 26px -6px var(--tc)}
.team.t2{--tc:var(--t2)}
.team.lead{background:linear-gradient(rgba(255,255,255,.07),rgba(255,255,255,.07)),var(--panel)}
.thead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;min-width:0}
.tname{font:400 clamp(15px,3.4vw,20px)/1.1 var(--display);text-transform:uppercase;color:var(--tc);overflow-wrap:anywhere;min-width:0}
.ttotal{font:900 clamp(34px,8vw,54px)/.95 var(--num);font-variant-numeric:tabular-nums;color:var(--ink);text-shadow:0 3px 0 rgba(0,0,0,.35)}
.prow{padding:10px 0 0;border-top:1px solid var(--panel-line);display:flex;flex-direction:column;gap:8px}
.phead{display:flex;align-items:center;gap:8px;min-width:0}
.pname{min-width:0;overflow-wrap:anywhere;font-weight:700}
.pscore{margin-left:auto;font:900 clamp(24px,5vw,32px)/1 var(--num);font-variant-numeric:tabular-nums;color:var(--accent)}
.pact{display:flex;gap:6px;flex-wrap:wrap}
.tag{font:700 11px var(--body);letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--accent);color:var(--accent-ink);white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;background:#5b4a86;flex:none}
.dot.on{background:var(--good);box-shadow:0 0 8px var(--good)}
.noplayer{margin:0;color:var(--muted);font-size:14px}

/* Editor */
.cated{display:flex;flex-direction:column;gap:12px}
.qrow{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:start}
.qpts{font:900 30px/1 var(--num);color:var(--accent);padding-top:10px}
@media (prefers-reduced-motion:no-preference){.tile{transition:filter .15s,transform .1s}}
.tablewrap{overflow-x:auto}
.results{width:100%;border-collapse:collapse;font-size:15px}
.results th{font:700 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:2px solid var(--panel-line);white-space:nowrap}
.results td{padding:10px;border-bottom:1px solid var(--panel-line);vertical-align:middle}
.results tr:last-child td{border-bottom:0}
.tbadge{display:inline-block;font:400 13px/1 var(--display);text-transform:uppercase;padding:5px 9px;border-radius:999px;border:2px solid var(--tc,var(--t1));color:var(--tc,var(--t1));white-space:nowrap}
.tbadge.t1{--tc:var(--t1)}.tbadge.t2{--tc:var(--t2)}
.resbanner{padding:12px 18px;border-radius:12px;font:800 clamp(18px,4vw,26px)/1.25 var(--body);background:rgba(8,4,18,.6);border:2px solid var(--good);color:var(--good);overflow-wrap:anywhere;max-width:100%}
.resbanner.bad{border-color:var(--bad);color:var(--bad)}
.okcell{color:var(--good);font-weight:700;white-space:normal}.badcell{color:var(--bad);font-weight:700;white-space:normal}
[hidden]{display:none!important}
img{max-width:100%}
input[type=radio]{width:auto;accent-color:var(--accent);flex:none;transform:scale(1.35);margin:0 4px}
input[type=file]{padding:9px;font-size:14px}
.qimg{width:100%;max-width:100%;max-height:64vh;border-radius:12px;object-fit:contain;background:rgba(255,255,255,.08);border:2px solid var(--tile-rim)}
.ol{flex:none;display:inline-grid;place-items:center;width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font:900 20px/1 var(--num)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%}
@media (max-width:560px){.opts{grid-template-columns:minmax(0,1fr)}}
.opt{display:flex;align-items:center;gap:12px;text-align:left;font:700 clamp(16px,3.6vw,22px)/1.25 var(--body);color:#fff;background:rgba(8,4,18,.55);border:2px solid var(--tile-rim);border-radius:12px;padding:12px 14px;min-width:0;overflow-wrap:anywhere;cursor:default}
.opt:disabled{color:#fff;opacity:1}
.opt:not(:disabled){cursor:pointer}
.opt:not(:disabled):hover{filter:brightness(1.25)}
.opt.picked{border-color:#fff;box-shadow:0 0 0 3px var(--accent)}
.opt.right{border-color:var(--good);background:rgba(56,224,160,.2)}
.opt.wrong{border-color:var(--bad);background:rgba(255,138,138,.2)}
.seg{display:inline-flex;border:2px solid var(--panel-line);border-radius:10px;overflow:hidden;align-self:flex-start}
.segbtn{font:700 14px var(--body);padding:8px 14px;border:0;background:transparent;color:var(--ink);cursor:pointer}
.segbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.optrow{display:flex;align-items:center;gap:10px}
.optrow input:not([type=radio]){flex:1;min-width:0}
.hint{font-size:13px;color:var(--muted)}
.imgrow{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.imgrow .field{flex:1 1 220px}
.imgprev{max-width:160px;max-height:110px;border-radius:8px;border:2px solid var(--panel-line);object-fit:cover}
/* Feinschliff Handy */
.thead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:baseline}
.thead .tname{grid-column:1;grid-row:1}
.thead .ttotal{grid-column:2;grid-row:1}
.thead .tag{grid-column:1 / -1;grid-row:2;justify-self:start}
.cat{font-size:clamp(9px,2.6vw,20px);overflow-wrap:break-word;hyphens:auto;padding-inline:3px}
@media (max-width:560px){.board{gap:5px;padding:7px}}
.results th{white-space:normal}
.results td,.results th{padding:8px 6px}
.results td .tbadge{display:inline-block;margin-top:4px}
.cellname{display:block;overflow-wrap:break-word;hyphens:auto}
input[type=file]::file-selector-button{font:700 13px var(--body);padding:6px 12px;border-radius:8px;border:0;background:var(--accent);color:var(--accent-ink);margin-right:10px;cursor:pointer}
/* Sound */
.audiobar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%}
.audiobtn{font-size:18px;padding:14px 24px}
.sndrow{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.sndrow .field{flex:1 1 220px}
.sndrow .row{flex:1 1 100%}
.sndprev{max-width:100%;height:40px}
.tile.used.look{color:rgba(255,255,255,.3);text-shadow:none;cursor:pointer;border-color:rgba(255,255,255,.08)}
.board.admin .tile.used.look:hover{color:rgba(255,255,255,.6);filter:brightness(1.3)}
.verdict{margin-top:6px;padding-top:12px;border-top:1px solid var(--panel-line)}
.vteam{display:flex;align-items:center;gap:8px;margin-top:6px}
.vrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-start;gap:8px 14px;padding:6px 0}.vname{min-width:70px}
.vname{font-weight:800;overflow-wrap:anywhere}
.verdict{border-top:0;padding-top:0}
.wholine{margin:0;text-align:center;font-weight:800;font-size:18px}
.vbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vbtn{font:900 clamp(20px,4.5vw,30px)/1.1 var(--body);padding:clamp(18px,4vw,28px) 10px;border-radius:14px;border:3px solid;cursor:pointer;color:#fff}
.vbtn.wide{grid-column:1/-1}
.vgood{background:#0f8a55;border-color:var(--good)}
.vbad{background:#b8283a;border-color:#ff6b7d}
.vbtn:hover{filter:brightness(1.15)}
.linkbtn{background:none;border:0;color:var(--muted,#b8a9e8);text-decoration:underline;cursor:pointer;font:inherit;font-size:14px;justify-self:center}
.ansimg{max-height:50vh;margin-top:12px;border-color:var(--accent)}
</style>

<script>
'use strict';
const ADMIN_SALT = 'quizabend-v1', ADMIN_ITER = 150000, ADMIN_HASH = '89859126277ce566f955ae22deb124b9ce10ed90b2193463abf5cf51423c4741';
const PEER_PREFIX = 'qabend-nw-';
const LSKEY = 'quizabend.sa.v1', SSKEY = 'quizabend.sa.admin', NAMEKEY = 'quizabend.sa.name';
const LETTERS = 'ABCD';
const VERSION = 'Version 11';

const lsx = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
};
const ssx = {
  get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) { /* ignorieren */ } },
  del(k) { try { sessionStorage.removeItem(k); } catch (e) { /* ignorieren */ } }
};
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clone = o => JSON.parse(JSON.stringify(o));

function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k === 'value') e.value = v;
    else if (k === 'checked') e.checked = !!v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, '');
    else e.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return e;
}

const clean = n => String(n == null ? '' : n).replace(/[\p{C}]/gu, '').trim().slice(0, 16);
const norm = c => String(c || '').trim().toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9_-]/g, '').replace(/^[^a-z0-9]+/, '').replace(/[^a-z0-9]+$/, '').slice(0, 48);
const ALPHA = 'abcdefghjkmnpqrstuvwxyz23456789';
function rand(n) {
  const a = new Uint32Array(n);
  crypto.getRandomValues(a);
  return Array.from(a, x => ALPHA[x % ALPHA.length]).join('');
}
const peerId = code => PEER_PREFIX + norm(code);

async function isAdminCode(code) {
  if (!window.crypto || !crypto.subtle) return null;
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey('raw', enc.encode(String(code).trim()), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: enc.encode(ADMIN_SALT), iterations: ADMIN_ITER, hash: 'SHA-256' }, key, 256);
  const hex = Array.from(new Uint8Array(bits), b => b.toString(16).padStart(2, '0')).join('');
  return hex === ADMIN_HASH;
}

/* ---------- Fragen ---------- */
const tq = (q, a) => ({ q, a, type: 'text', opts: ['', '', '', ''], ok: 0, img: '', iv: 0, au: '', av: 0, ai: '', aiv: 0 });
const mq = (q, opts, ok) => ({ q, a: '', type: 'mc', opts, ok, img: '', iv: 0, au: '', av: 0, ai: '', aiv: 0 });
function defaultBoard() {
  return normBoard({
    title: 'Quiz-Abend',
    values: [100, 200, 300, 400, 500],

      { name: 'Allgemeinwissen', qs: [

        tq('Welches chemische Symbol hat Gold?', 'Au'),
        tq('In welchem Jahr fiel die Berliner Mauer?', '1989')] },
      { name: 'Schweiz', qs: [

function normBoard(b) {

async function startHost(delay, attempt) {

  S.peer = p;

  p.on('open', () => { if (S.peer !== p) return; S.live = 'on'; S.netErr = ''; refreshAdmin(); broadcast(); });
  p.on('connection', conn => { if (S.peer !== p) { try { conn.close(); } catch (e) { /* ignorieren */ } return; } onConn(conn); });
  p.on('disconnected', () => {
    if (S.peer !== p || p.destroyed) return;
    S.live = 'connecting'; refreshAdmin();
    setTimeout(() => { try { if (S.peer === p && !p.destroyed) p.reconnect(); } catch (e) { /* ignorieren */ } }, 1500);
  });
  p.on('error', e => {
    if (S.peer !== p) return;
    const t = (e && e.type) || 'error';
    if (t === 'unavailable-id' && attempt < 5) {

      S.peer = null; try { p.destroy(); } catch (x) { /* ignorieren */ }
      S.live = 'connecting'; refreshAdmin();
      startHost(2000, attempt + 1);

function onConn(conn) {

  conn.on('close', () => { if (S.conns.get(conn.peer) === conn) { S.conns.delete(conn.peer); refreshAdmin(); } });
  conn.on('error', () => { /* ignorieren */ });
}

function onHello(conn, m) {
  let name = clean(m.name);
  if (!name) { try { conn.send({ t: 'denied', why: 'Bitte gib einen Namen ein.' }); } catch (e) { /* ignorieren */ } return; }
  if (name.startsWith('__')) name = '_' + name.slice(2);
  S.conns.forEach((c, id) => {
    if (c !== conn && c._name === name) {
      try { c.send({ t: 'denied', why: 'Du bist mit diesem Namen auf einem anderen Gerät beigetreten.' }); } catch (e) { /* ignorieren */ }
      try { c.close(); } catch (e) { /* ignorieren */ }
      S.conns.delete(id);
    }
  });
  const prev = S.conns.get(conn.peer);
  if (prev && prev !== conn) { try { prev.close(); } catch (e) { /* ignorieren */ } }
  conn._name = name; conn._img = ''; conn._au = ''; conn._ai = '';
  S.conns.set(conn.peer, conn);
  const g = game(), has = k => Object.prototype.hasOwnProperty.call(g.scores, k);
  let changed = false;
  if (!has(name)) { g.scores[name] = 0; changed = true; }
  if (g.team[name] !== 0 && g.team[name] !== 1) {
    const vals = Object.keys(g.scores).filter(n => n !== name).map(n => g.team[n]);
    g.team[name] = vals.filter(v => v === 0).length <= vals.filter(v => v === 1).length ? 0 : 1;
    changed = true;
  }
  if (changed) commit(); else { broadcast(); refreshAdmin(); }
}

function broadcast() {

  S.conns.forEach(c => {

    try {
      if (im && c._img !== im.k) { c.send({ t: 'img', k: im.k, d: im.d }); c._img = im.k; }
      if (ai && c._ai !== ai.k) { c.send({ t: 'img', k: ai.k, d: ai.d }); c._ai = ai.k; }
      c.send({ t: 'state', d: st });
      /* Der Sound kommt nach dem Zustand, damit die Frage sofort sichtbar ist */
      if (au && c._au !== au.k) { c.send({ t: 'au', k: au.k, d: au.d }); c._au = au.k; }
    } catch (e) { /* ignorieren */ }
  });

function joinGame(code, name) {

      ? 'Der Admin hat nicht geantwortet. Prüfe den Code und ob dein Admin die Seite geöffnet hat.'
      : 'Keine Verbindung zum Vermittlungsserver. Prüfe dein Internet und versuche es noch einmal.');
  }, 15000);

function startPlayerPeer() {
  let p;
  try { p = new Peer({ debug: 0 }); } catch (e) { return backToLogin('Die Live-Verbindung konnte nicht gestartet werden.'); }
  S.peer = p;
  p.on('open', () => { if (S.peer === p) connectToHost(); });
  p.on('error', e => {
    if (S.peer !== p) return;
    const t = (e && e.type) || 'error';
    if (S.mode === 'join') {
      if (t === 'peer-unavailable') {
        /* Der Admin lädt vielleicht gerade neu oder hat den Code eben erst geändert: ein paar Mal nachfragen */
        if ((S.joinTries = (S.joinTries || 0) + 1) <= 3) { setTimeout(() => { if (S.mode === 'join' && S.peer === p) connectToHost(); }, 1500); return; }
        backToLogin('Kein laufendes Spiel mit diesem Code. Prüfe den Code (nicht den Admin-Code) und ob dein Admin die Seite geöffnet hat.');
      } else backToLogin('Keine Verbindung zum Vermittlungsserver (' + t + '). Versuche es noch einmal.');
    } else if (S.mode === 'player') { S.stale = true; render(); playerReconnect(); }
  });
  p.on('disconnected', () => {
    if (S.peer === p && !p.destroyed && (S.mode === 'player' || S.mode === 'join')) { try { p.reconnect(); } catch (e) { /* ignorieren */ } }
  });
}

function connectToHost() {
  const p = S.peer;
  if (!p || p.destroyed) return;
  if (S.conn) { try { S.conn.close(); } catch (e) { /* ignorieren */ } }
  const c = p.connect(peerId(S.joinCode), { reliable: true });
  S.conn = c;
  c.on('open', () => { if (S.conn === c) c.send({ t: 'hello', name: S.me }); });
  c.on('data', m => { if (S.conn === c) onHostMsg(m); });
  c.on('close', () => { if (S.conn === c && S.mode === 'player') { S.stale = true; render(); playerReconnect(); } });
  c.on('error', () => { /* ignorieren */ });
}

function playerReconnect() {
  clearTimeout(S.rt);
  S.rt = setTimeout(() => {
    if (S.mode !== 'player') return;
    const p = S.peer;
    if (!p || p.destroyed) startPlayerPeer();
    else { if (p.disconnected) { try { p.reconnect(); } catch (e) { /* ignorieren */ } } connectToHost(); }
    playerReconnect();
  }, 3000);
}

function onHostMsg(m) {
  if (!m || typeof m !== 'object') return;
  if (m.t === 'closed') return backToLogin('Das Quiz wurde beendet oder der Code wurde geändert. Gib den neuen Code ein.');
  if (m.t === 'denied') return backToLogin(String(m.why || 'Beitritt abgelehnt.'));
  if (m.t === 'img' && typeof m.k === 'string' && typeof m.d === 'string' && m.d.startsWith('data:image/')) {
    S.imgs[m.k] = m.d;
    if (S.mode === 'player') render();
    return;
  }
  if (m.t === 'au' && typeof m.k === 'string' && typeof m.d === 'string' && m.d.startsWith('data:audio/')) {
    S.audio[m.k] = m.d;
    if (S.pendingPlay === m.k) { S.pendingPlay = ''; playAudio(m.k, m.d); }
    if (S.mode === 'player') render();
    return;
  }
  if (m.t === 'state') acceptState(m.d);
}

function acceptState(d) {
  if (!d || !Array.isArray(d.cats) || !Array.isArray(d.vals)) return;
  clearTimeout(S.joinT); clearTimeout(S.rt);
  S.lastState = Date.now();
  const j = JSON.stringify(d);
  if (j === S.lastJson && S.mode === 'player' && !S.stale) return;
  /* Hat der Admin „Für alle abspielen“ gedrückt? Beim ersten Zustand einer Frage nur merken, nicht abspielen */
  const q = d.q;
  if (q && q.au) {
    const prev = S.apSeen[q.au];
    if (prev === undefined) S.apSeen[q.au] = q.ap || 0;
    else if ((q.ap || 0) > prev) { S.apSeen[q.au] = q.ap; S.playNow = q.au; }
  }
  S.lastJson = j; S.pstate = d; S.mode = 'player'; S.stale = false;
  render();
  if (S.playNow) {
    const k = S.playNow; S.playNow = '';
    if (S.audio[k]) playAudio(k, S.audio[k]); else S.pendingPlay = k;
  }
}

function copyText(text, btn, label) {
  const done = ok => { btn.textContent = ok ? 'Kopiert' : 'Nicht möglich'; setTimeout(() => { btn.textContent = label; }, 1600); };
  const fallback = () => {
    try {
      const t = el('textarea', { style: 'position:fixed;left:-9999px;top:0' });
      t.value = text; document.body.append(t); t.select();
      const ok = document.execCommand('copy'); t.remove(); done(ok);

  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => done(true), fallback);
  else fallback();
}

function boardEl(st, mode, onPick, onUsed) {
  const b = el('div', { class: 'board ' + mode, style: '--n:' + st.cats.length });
  st.cats.forEach(c => b.append(el('div', { class: 'cat', text: c.n })));
  st.vals.forEach((v, r) => st.cats.forEach((c, ci) => {
    const t = c.t[r];
    const pv = c.v && c.v[r] !== undefined ? c.v[r] : v;
    const live = t === 1 && onPick, look = t === 2 && onUsed;
    b.append(el('button', {
      type: 'button',
      class: 'tile ' + (t === 1 ? 'open' : t === 2 ? 'used' : 'none') + (look ? ' look' : ''),
      disabled: !(live || look),
      'aria-label': t === 1 ? c.n + ' für ' + pv + ' Punkte' : look ? c.n + ' für ' + pv + ' Punkte ansehen (schon gespielt)' : null,
      'aria-hidden': (t === 1 || look) ? null : 'true',

function teamCards(st, admin) {
  const names = Object.keys(st.sc), tm = st.tm || {}, tn = st.tn || ['Team 1', 'Team 2'];
  const total = t => names.filter(n => tm[n] === t).reduce((s, n) => s + st.sc[n], 0);
  const card = t => {
    const members = names.filter(n => tm[n] === t);
    const box = el('section', { class: 'team t' + (t + 1) + (total(t) > total(1 - t) ? ' lead' : ''), 'aria-label': String(tn[t]) },
      el('div', { class: 'thead' }, el('span', { class: 'tname', text: String(tn[t]) }),
        (st.tu === 1 ? 1 : 0) === t ? el('span', { class: 'tag', text: 'ist dran' }) : null,
        el('span', { class: 'ttotal', text: String(total(t)) })));
    if (!members.length) box.append(el('p', { class: 'noplayer', text: 'Noch kein Spieler im Team.' }));
    members.forEach(n => box.append(playerRow(n, st, admin, t)));

/* ---------- Sound: ein gemeinsamer Player, damit er beim Neuzeichnen weiterläuft ---------- */
const AU = { el: new Audio(), key: '', btn: null };
AU.el.preload = 'auto';
function syncAudioBtn() { if (AU.btn && AU.btn.isConnected) AU.btn.textContent = AU.el.paused ? '\u25B6 Sound abspielen' : '\u25A0 Stopp'; }
['play', 'pause', 'ended'].forEach(ev => AU.el.addEventListener(ev, syncAudioBtn));
function playAudio(key, src) {
  if (!src) return;
  if (AU.key !== key) { AU.el.src = src; AU.key = key; }
  try { AU.el.currentTime = 0; } catch (e) { /* ignorieren */ }
  const p = AU.el.play();
  if (p && p.catch) p.catch(() => setNote('Der Browser hat das Abspielen blockiert. Tippe auf „Sound abspielen“.'));
}
function stopAudio() {
  AU.el.pause(); AU.key = '';
  AU.el.removeAttribute('src');
  try { AU.el.load(); } catch (e) { /* ignorieren */ }
}
function toggleAudio(key, src) {
  if (AU.key === key && !AU.el.paused) { AU.el.pause(); try { AU.el.currentTime = 0; } catch (e) { /* ignorieren */ } }
  else playAudio(key, src);
}
function audioFor(key) {
  if (S.mode === 'admin') {
    const [c, r] = String(key).split('-').map(Number);
    const x = board().cats[c] && board().cats[c].qs[r];
    return x ? x.au : '';
  }
  return S.audio[key] || '';
}
function currentAudioKey() {
  if (S.mode === 'admin') {
    const g = game(), cu = g.cur || S.review;
    if (!cu) return '';
    const x = board().cats[cu.c] && board().cats[cu.c].qs[cu.r];
    return x && x.au ? auKey(cu.c, cu.r) : '';
  }
  return S.pstate && S.pstate.q ? S.pstate.q.au || '' : '';
}
function playForAll(key, src) {
  const g = game();
  if (!g.cur) return;
  g.cur.ap = (g.cur.ap || 0) + 1;
  playAudio(key, src);
  commit();
}
function audioControls(key, admin) {
  const src = audioFor(key);
  const bar = el('div', { class: 'audiobar' });
  if (!src) { bar.append(el('span', { class: 'muted', text: 'Sound lädt …' })); return bar; }
  const btn = el('button', { type: 'button', class: 'btn audiobtn', text: (AU.key === key && !AU.el.paused) ? '\u25A0 Stopp' : '\u25B6 Sound abspielen', onclick: () => toggleAudio(key, src) });
  AU.btn = btn;
  bar.append(btn);
  if (admin) bar.append(el('button', { type: 'button', class: 'btn ghost audiobtn', text: '\u25B6 Für alle abspielen', onclick: () => playForAll(key, src) }));
  return bar;
}

  if (!who) { box.append(el('p', { class: 'muted', text: 'Stelle einen Spieler in dieses Team (rechts bei „Team wechseln“), damit du werten kannst.' })); return box; }

  if (mc && cur.pick >= 0) {

function loadImage(file) {

/* Wandelt jede Audiodatei in ein kleines Mono-WAV um (spielt auf allen Geräten, Länge begrenzt) */
async function blobToWav(blob, maxSec) {
  const buf = await blob.arrayBuffer();
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC || !window.OfflineAudioContext) throw new Error('noaudio');

  let audio;
  try { audio = await new Promise((res, rej) => ctx.decodeAudioData(buf, res, rej)); }
  finally { try { ctx.close(); } catch (e) { /* ignorieren */ } }
  const rate = 16000, dur = Math.min(audio.duration, maxSec), len = Math.max(1, Math.ceil(dur * rate));

  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, 'data'); v.setUint32(40, data.length * 2, true);

  for (let i = 0; i < data.length; i++) { const x = Math.max(-1, Math.min(1, data[i])); v.setInt16(o, x < 0 ? x * 0x8000 : x * 0x7FFF, true); o += 2; }

}
async function loadAudioFile(file) {

  const r = await blobToWav(file, 30);

const fmtSec = n => Math.floor(n / 60) + ':' + String(n % 60).padStart(2, '0');

async function startRec(x, id) {

  let stream;

}

async function codeProblem(code, exceptId) {
  const n = norm(code);
  if (n.length < 4) return 'Der Code braucht mindestens 4 Zeichen (Buchstaben, Ziffern, - und _).';
  if (DB.items.some(x => x.id !== exceptId && norm(x.code) === n)) return 'Dieser Code gehört schon zu einem anderen Quiz.';
  try { if (await isAdminCode(code)) return 'Das ist dein Admin-Code. Wähle einen anderen.'; } catch (e) { /* ignorieren */ }
  return '';
}

  let c;

}

        const p = JSON.parse(String(fr.result));
        const data = fixDB(p && p.data ? p.data : p);
        if (!data) throw new Error('leer');
        S.importData = data; render();
      } catch (x) { S.importData = null; setNote('Diese Datei ist keine gültige Sicherung.'); }
    };
    fr.readAsText(f);
  } });
  const backup = el('div', { class: 'panel stack' }, el('h2', { text: 'Sicherung' }),
    el('p', { class: 'muted', text: 'Deine Quizze, Bilder und Punkte liegen nur in diesem Browser auf diesem Gerät. Speichere eine Sicherung, bevor du das Gerät wechselst oder die Browserdaten löschst.' }),
    el('div', { class: 'row' }, el('button', { class: 'btn ghost', type: 'button', text: 'Sicherung speichern', onclick: exportBackup })),
    field('Sicherung laden (ersetzt alles, was jetzt hier ist)', 'st-import', imp),
    S.importData ? el('div', { class: 'row' },
      el('span', { text: S.importData.items.length + ' Quiz' + (S.importData.items.length === 1 ? '' : 'ze') + ' gefunden.' }),
      el('button', { class: 'btn danger', type: 'button', text: 'Jetzt ersetzen', onclick: applyImport }),
      el('button', { class: 'btn ghost', type: 'button', text: 'Abbrechen', onclick: () => { S.importData = null; render(); } })) : null);
  return el('div', { class: 'stack' }, form, reset, backup,
    el('p', { class: 'muted small', text: 'Der Admin-Code steht (verschlüsselt) in der Datei dieser Seite. Um ihn zu ändern, braucht es eine neue Datei. ' + VERSION + '.' }));
}

function viewAdmin() {
  if (S.preview) {
    const page = viewPlayer(publicState(), true);
    page.insertBefore(el('div', { class: 'banner row' },
      el('span', { text: 'Spieleransicht: So sehen deine Spieler die Seite. Du bist ohne Code hier, weil du Admin bist.' }),
      el('button', { class: 'btn', type: 'button', text: 'Zurück zur Spielleitung', onclick: () => { S.preview = false; render(); } })), page.children[1]);
    return page;
  }
  const tabs = [['game', 'Spiel'], ['quiz', 'Quizze'], ['edit', 'Fragen'], ['set', 'Einstellungen']];
  const bar = el('div', { class: 'tabs', role: 'tablist' }, tabs.map(([k, label]) => el('button', {
    type: 'button', class: 'tab', role: 'tab', 'aria-selected': S.tab === k ? 'true' : 'false', text: label,
    onclick: () => { if (S.tab === 'edit' && k !== 'edit') stopRec(); if (k === 'edit' && S.tab !== 'edit') startEdit(); S.tab = k; S.confirmReset = false; S.confirmDel = ''; S.importData = null; render(); }
  })));
  const body = S.tab === 'game' ? viewAdminGame() : S.tab === 'quiz' ? viewQuizzes() : S.tab === 'edit' ? viewEditor() : viewSettings();
  return shell(board().title,
    el('div', { class: 'row' }, mini('Spieleransicht', () => { S.preview = true; render(); }), mini('Abmelden', logoutAdmin), el('span', { class: 'chip', text: 'Admin' })),
    bar, liveBanner(), body);
}

/* ---------- Anzeige und Start ---------- */
function render() {
  const app = $('#app');
  const active = document.activeElement && document.activeElement.id;
  if (!currentAudioKey() && AU.key) stopAudio();
  const view = { boot: viewBoot, login: viewLogin, join: viewJoin, player: () => viewPlayer(S.pstate, false), admin: viewAdmin }[S.mode];
  app.replaceChildren(view());
  if (active) { const n = document.getElementById(active); if (n && n.focus && S.mode !== 'player') n.focus(); }
}
/* Während du tippst (Fragen, Einstellungen), wird die Seite nicht von Beitritten neu gezeichnet */
function refreshAdmin() { if (S.mode === 'admin' && (S.preview || S.tab === 'game' || S.tab === 'quiz')) render(); }

(async function boot() {
  S.mode = 'boot';
  render();
  await loadDB();
  S.mode = 'login';
  if (ssx.get(SSKEY) === '1') enterAdmin(); else render();
})();
</script></body></html>
